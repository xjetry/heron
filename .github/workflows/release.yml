name: release
on:
  push:
    tags: ["v*"]
# 权限按 job 最小化：image 推版本 tag、promote 移动 latest 要 packages: write，publish 建 Release 要 contents: write，
# 其余只读。顶层为空集，新 job 不显式声明就没有任何权限。写权限都不给运行第三方代码的 job：build 跑构建工具链，
# readback 运行被构建的镜像，它们的 token 只能读。
permissions: {}
# latest 是共享指针：回读与移动 latest 都假设推送到回读之间没有别的写者，同组的运行串行。同组里已在排队的
# 运行会被后来者替换并取消，被取消的 tag 需要手工重跑。
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # 发布凭主干 CI 在同一提交上的结论放行（scripts/release-ci-gate.sh）：ci.yml 在 push 到 main 时对这棵树跑的是
  # make ci 的超集，build 因此不再重跑测试、脚本与前端门禁。其余 job 都直接或经 build 依赖它，没通过就什么都不构建、
  # 不推送、不签名（scripts/release-rules-test.sh 核对）。actions: read 只用来列 ci.yml 的 run；这个 job 只运行按 SHA
  # 固定的 checkout、运行器自带的 gh 与仓库里的这个脚本，不装依赖、不跑构建工具链，权限也只有读。
  gate:
    runs-on: ubuntu-latest
    # 脚本最多等主干 CI 50 分钟（RELEASE_CI_GATE_WAIT 的默认值），加上取代码与调用 API 的余量。
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: scripts/release-ci-gate.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    # 发布种类交给镜像的三个 job：agent 组的镜像只随完整 release 推送、回读与 promote，三个 job 据它
    # 决定是否处理 agent 组。它们不能自己判定：判定要编译运行 scripts/releasekind，而持推送权限的 job 不装 Go。
    # 用它的 job 必须在 needs 里列出 build，否则读到空值、静默跳过 agent 组（scripts/release-rules-test.sh 核对）。
    outputs:
      kind: ${{ steps.kind.outputs.kind }}
    steps:
      # 不把 token 留在工作区的 .git/config：make lint、发布目标与 make e2e 会运行 pnpm 依赖、Go 模块、buf 与 Makefile 下载的 shellcheck 等第三方代码。
      # 同一 job 里的代码能从运行器进程取到 job token，所以这个 job 只有 contents: read，推镜像、移动 latest 与
      # 建 Release 的写权限在不运行这些代码的 image、promote、publish 里。需要 token 的步骤各自经输入拿到
      # （buf、setup-go、setup-node 的输入默认值），没有一步依赖工作区里的凭据。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # 只发 hub 的门禁要在本地检出绑定版本的 tag（git worktree add），浅克隆没有它。
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          setup_only: true
      # lint 里的 buf breaking 要一个对照 ref。这里的检出是 detached 的 tag，没有本地分支（branch=main 在这里找不到），
      # 而发出去的 proto 要与已经发出去的兼容：对照上一个发布 tag，由 make release-breaking-base 判定；仓库的第一个发布
      # 没有可对照的 tag，判定为 none，lint 复核后跳过 buf breaking（scripts/buf-breaking.sh）。写进 GITHUB_ENV，
      # 之后每一步 make 都读到同一个值。
      - run: |
          base=$(make -s release-breaking-base VERSION="$GITHUB_REF_NAME")
          case "$base" in
            v*|none) ;;
            *) echo "make release-breaking-base printed '$base'" >&2; exit 1 ;;
          esac
          echo "BUF_AGAINST_REF=$base" >> "$GITHUB_ENV"
      # 测试、脚本、前端与生成物门禁不在这里重跑：它们只读这棵树与固定的工具链（go.mod、锁文件、按 SHA 固定的 action），
      # gate 核对过的主干 CI 在同一提交上的通过就是它们的凭据。make lint 照跑，因为其中两项的结论不只取决于这棵树：
      # buf breaking 对照上一个发布 tag（上一步写进的 BUF_AGAINST_REF；主干 CI 在 main 上是与自己比较，恒通过），
      # govulncheck 读发布时刻的漏洞库。lint 的其余各项随之重跑。
      - run: make lint
      # 发布种类只由 scripts/releasekind 判定：先取判定，再调用对应的发布目标；后续步骤读
      # 同一个输出。
      - id: kind
        run: |
          kind=$(make -s release-kind VERSION="$GITHUB_REF_NAME")
          case "$kind" in
            full|hub-only) ;;
            *) echo "make release-kind printed '$kind'" >&2; exit 1 ;;
          esac
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
      # 与本地验收同一组发布目标；版本注入、版本号守卫、只发 hub 的门禁与静态门禁都在目标里。
      - run: make "release-$KIND" VERSION="$GITHUB_REF_NAME"
        env:
          KIND: ${{ steps.kind.outputs.kind }}
      # 端到端要在 amd64 运行器上运行 arm64 的 agent 容器。镜像构建不需要它：Dockerfile 唯一的 RUN 所在阶段
      # 固定在 --platform=$BUILDPLATFORM，最终阶段没有 RUN。binfmt 容器以特权运行，等同运行器上的 root，步骤
      # 顺序不提供隔离；它是否可信由 image 的 digest 固定与 action 的 SHA 固定承载。镜像不经 Actions 缓存。
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false
      # 发布前用真实 hub 验证当前 agent。
      - run: make e2e
        env:
          E2E_LISTEN_HOST: 0.0.0.0
      # 只发 hub 时实际发出去的组合是 hub 加绑定版本已发布的 agent，用那份 agent 再跑一遍端到端。
      - if: steps.kind.outputs.kind == 'hub-only'
        run: make bound-agent-e2e
        env:
          E2E_LISTEN_HOST: 0.0.0.0
      # 镜像只在这里构建一次：每个镜像组两个平台导出为 OCI 布局，按索引 digest 核对两个平台的根文件系统、冒烟本机
      # 平台，通过后记下 <版本> <索引 digest> <AGENT_VERSION>。布局与记录一起交给 image、readback、promote，推送的
      # 就是这份布局。
      # 完整 release 构建两组（make docker；agent 组的冒烟对着同一次构建的 hub）；只发 hub 只构建 hub 组，agent 组的
      # 镜像停在绑定版本已发布的那一个。目录即 deploy/image.mk 的 IMAGE_ARCHIVE_DIR，每组一个子目录；对不上时这里以
      # if-no-files-found 失败，之后的 job 以缺少构建记录失败。
      - if: steps.kind.outputs.kind == 'hub-only'
        run: make docker-hub VERSION="$GITHUB_REF_NAME"
      # 运行器的挂载根是真根：agent 组冒烟要求容器节点与宿主对照节点的执行环境都识别为 HOST。
      - if: steps.kind.outputs.kind == 'full'
        run: make docker VERSION="$GITHUB_REF_NAME"
        env:
          SMOKE_EXPECT_SCOPE_KIND: HOST
      # 发布清单最后生成（make release-manifest）：AGENT_VERSION、IMAGES（取上一步的镜像构建记录）与覆盖全部资产的
      # SHA256SUMS，签名 job 签的就是它。构建记录或安装脚本与本次的版本对不上时在这里失败，不上传任何东西。
      - run: make release-manifest VERSION="$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: build/image-archive/
          if-no-files-found: error
          retention-days: 7
      # dist 交给签名 job；签名 job 不重新构建，它签的就是这里通过 e2e 的那一份产物与它的清单。
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
  # 私钥只进这个 job：它不运行 build job 里 make lint、发布目标的第三方代码，只编译标准库与 internal/releasesig
  # （scripts/releasesign 的依赖检查守着），也不恢复构建 job 写过的 Go 缓存——被污染的依赖可能在缓存里留下
  # 编译产物。私钥只经 env 交给签名那一步。
  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: sign
        env:
          HERON_RELEASE_SIGNING_KEY: ${{ secrets.HERON_RELEASE_SIGNING_KEY }}
        run: go run ./scripts/releasesign sign -version "$GITHUB_REF_NAME" -dir dist
      - run: go run ./scripts/releasesign verify -version "$GITHUB_REF_NAME" -dir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signature
          path: dist/SHA256SUMS.sig
          if-no-files-found: error
          retention-days: 7
  # 镜像的推送、回读与移动 latest 分在三个 job，按"持写权限的 job 不运行任何第三方代码，包括被构建的镜像"切分：
  # image 与 promote 持 packages: write，只调用 imagetools 读 digest、复制索引，不拉取、不起容器（scripts/docker-image-test.sh
  # 钉住）；readback 运行被构建的镜像（冒烟、导出根文件系统），所以只有 contents: read、不登录任何 registry。三个
  # job 都不跑 make lint、发布目标与 make web，不装 pnpm、node 与 buf，不重新构建镜像，不恢复构建 job 写过的 Go 缓存；
  # 各自只调用一个 make 目标，配方由 scripts/release-rules-test.sh 逐行钉住。工具全部固定：action 按 SHA，buildx
  # 按版本与 SHA-256（scripts/docker-buildx-install.sh），BuildKit、binfmt、alpine 按 digest，Go 按 go.mod。
  # 推到 registry、回读通过、latest 指向的都是 build job 核对过的那个索引，由 scripts/docker-image.sh 的显式比对承载：
  # push 前布局里的索引必须是构建记录里的 digest 并按它取源，回读时版本 tag 的 digest 必须等于构建记录，promote 时
  # 回读记录必须等于构建记录、版本 tag 仍指向它。
  # 每个 job 先处理 hub 组，完整 release 时再处理 agent 组（needs.build.outputs.kind，见 build job 的 outputs）；两组
  # 各用各的构建记录与回读记录（IMAGE_ARCHIVE_DIR/<组>/），回读记录各自一个 artifact。只发 hub 时三个 job 不碰 agent
  # 组的任何目标与记录（scripts/release-rules-test.sh 核对）。
  # 重跑：任一 job 失败都可以单独重跑，依赖它的 job 随之重跑。image 重跑从同一份 artifact 再推同一个索引；readback
  # 重跑匿名重新回读并重新交出回读记录（首次发布的包默认私有，改为公开后重跑的就是它）；promote 重跑重新比对两份
  # 记录与版本 tag，latest 已在前一次移过时移到同一个 digest。重跑 build 会产出新的布局与记录（digest 可能不同），
  # 其后各 job 随之重跑。artifact 保留 7 天，过期后只能整体重跑。
  image:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: scripts/docker-buildx-install.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: build/image-archive
      # registry 只在 deploy/image.mk 定义，两个组的仓库都在它下面，登录与推送不会指向两个不同的 registry。
      - id: registry
        run: |
          host=$(make -s docker-registry)
          echo "host=$host" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # 只推版本 tag；latest 由 promote 按回读过的 digest 移动。
      - run: make docker-hub-push VERSION="$GITHUB_REF_NAME"
      - if: needs.build.outputs.kind == 'full'
        run: make docker-agent-push VERSION="$GITHUB_REF_NAME"
  # 运行被构建镜像的 job：匿名拉取、逐平台冒烟、逐平台核对根文件系统。checkimage 在这里从源码编译（GOPROXY=off），
  # 不取构建 job 的产物：那个 job 跑过第三方代码，它交出的可执行文件不该被当作核对工具。被测的镜像不在这里重新构建：
  # agent 组冒烟要的 hub 从同一份 image artifact 的 hub 布局按构建记录载入（scripts/docker-image.sh 的 load_hub）。
  readback:
    needs: [build, image]
    runs-on: ubuntu-latest
    # 完整 release 时两组的回读在这个 job 里串行，每组都在 QEMU 上冒烟 arm64；上限按只回读 hub 时的 20 分钟加一半。
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - run: scripts/docker-buildx-install.sh
      # 回读在 amd64 运行器上运行 arm64 镜像。binfmt 的可信度同 build job 的这一步。
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: build/image-archive
      # 回读记录交给 promote，每组一个 artifact；路径即 deploy/image.mk 的 image_<组>_record。单个文件的 artifact 以
      # 它所在的目录为根，promote 下载回同一个目录。
      - run: make docker-hub-readback VERSION="$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readback-hub
          path: build/image-archive/hub/readback
          if-no-files-found: error
          retention-days: 7
      # 本机平台（amd64）的冒烟做宿主对照，运行器的挂载根是真根，要求两个节点的执行环境都识别为 HOST。
      - if: needs.build.outputs.kind == 'full'
        run: make docker-agent-readback VERSION="$GITHUB_REF_NAME"
        env:
          SMOKE_EXPECT_SCOPE_KIND: HOST
      - if: needs.build.outputs.kind == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readback-agent
          path: build/image-archive/agent/readback
          if-no-files-found: error
          retention-days: 7
  promote:
    needs: [build, readback]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: scripts/docker-buildx-install.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: build/image-archive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: readback-hub
          path: build/image-archive/hub
      - if: needs.build.outputs.kind == 'full'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: readback-agent
          path: build/image-archive/agent
      - id: registry
        run: |
          host=$(make -s docker-registry)
          echo "host=$host" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: make docker-hub-promote VERSION="$GITHUB_REF_NAME"
      - if: needs.build.outputs.kind == 'full'
        run: make docker-agent-promote VERSION="$GITHUB_REF_NAME"
  # 镜像回读不过、latest 没处理完就不建 Release：Release 最后创建，latest 只指向回读通过的镜像。Release 已建之后
  # 重跑 publish 会停在"release 已存在"。
  publish:
    needs: [sign, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      # 回读按 IMAGES 读 registry 上版本 tag 的索引 digest，用与镜像 job 同一个固定版本的 buildx；匿名读取，不登录。
      - run: scripts/docker-buildx-install.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signature
          path: dist
      # prerelease 与镜像是否移动 latest 读同一个判定（make release-channel）。
      - run: |
          channel=$(make -s release-channel VERSION="$GITHUB_REF_NAME")
          case "$channel" in
            prerelease) extra=--prerelease ;;
            stable) extra= ;;
            *) echo "make release-channel printed '$channel'" >&2; exit 1 ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" ${extra:+"$extra"}
        env:
          GH_TOKEN: ${{ github.token }}
      # 回读：验的是 Release 页面上实际可下载的字节，不是本 job 手里的文件。取回 SHA256SUMS、签名、AGENT_VERSION 与
      # IMAGES，验签后严格解析清单、核对两个清单资产的摘要、AGENT_VERSION 等于 make -s agent-version、IMAGES 的格式、
      # tag 与镜像组合乎发布种类，并按 IMAGES 核对 registry 上版本 tag 当前的索引 digest；只发 hub 时另取回绑定版本的
      # 两个 agent 安装脚本核对。逻辑在 scripts/release-manifest.sh 的 readback，由 scripts/release-manifest-test.sh 用替身执行。
      - run: make release-readback VERSION="$GITHUB_REF_NAME"
        env:
