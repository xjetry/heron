version: v2
managed:
  enabled: false
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen
    opt: paths=source_relative
  - local: ["web/node_modules/.bin/protoc-gen-es"]
    out: web/src/gen
    opt: target=ts
