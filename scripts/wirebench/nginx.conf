# 常见的 nginx 反代写法：TLS 与 HTTP/2 在 443，上游 HTTP/1.1 长连接。连接相关的指令（keepalive_timeout、
# keepalive_requests、ssl_session_tickets 等）全取默认值——被测的就是默认行为。@TAP@ 由 run.sh 换成内侧
# 计数中继的地址。日志格式里 $connection 与 $connection_requests 是连接复用的直接证据，$ssl_alpn_protocol
# 与 $server_protocol 是协商出的协议。
events {}
http {
    log_format wirebench '$time_iso8601 conn=$connection reqs=$connection_requests proto=$server_protocol '
                         'alpn=$ssl_alpn_protocol tls=$ssl_protocol cipher=$ssl_cipher curve=$ssl_curve '
                         'status=$status request_length=$request_length bytes_sent=$bytes_sent uri=$uri';
    access_log /dev/stdout wirebench;
    error_log /dev/stderr info;
    upstream hub {
        server @TAP@;
        keepalive 4;
    }
    server {
        listen 443 ssl;
        http2 on;
        server_name hub.wirebench.test;
        ssl_certificate /certs/chain.pem;
        ssl_certificate_key /certs/key.pem;
        location / {
            proxy_pass http://hub;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
