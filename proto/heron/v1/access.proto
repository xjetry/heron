syntax = "proto3";

package heron.v1;

option go_package = "github.com/xjetry/heron/gen/heron/v1;heronv1";

import "google/protobuf/descriptor.proto";

// Access 声明 AdminService 的方法接受哪种凭据，由挂载时绑定的拦截器在构造时读出并裁决。
// 每个方法都必须显式声明：ACCESS_UNSPECIFIED 让 hub 在构造处理器时拒绝启动，
// 因而不存在"漏标时默认放行还是默认拒绝"的取舍。
enum Access {
  ACCESS_UNSPECIFIED = 0;
  // 登录入口：校验请求体里的密码与第二因素，或 Passkey 挑战响应，不需要现有会话或 API token。
  ACCESS_LOGIN = 1;
  // 无副作用，不列出或管理任何凭据，也不回显可能含密钥的内容——配置本身，或外部接收方对它的回显：
  // 会话与 API token 都可调用。把方法改成 ACCESS_READ 就是扩大 API token 的权限。
  ACCESS_READ = 2;
  // 仅会话：有副作用的方法，以及凭据管理（包括只读的 ListApiTokens——自动化进程
  // 没有理由知道还有哪些 token 存在），以及回显可能含密钥的内容的方法（如
  // ListNotifyChannels：webhook 请求体模板里可能放着密钥；GetAlertDeliveryError：
  // 接收方可能在错误响应里回显收到的请求体）。
  ACCESS_SESSION = 3;
  // 类型化变更入口：会话或具有相应预授权的 API token，资源范围在写事务内再次裁决。
  ACCESS_CHANGE = 4;
}

// Audit 声明方法的成功调用是否写操作记录（Operation，经 ListOperations 查询）。ACCESS_SESSION 与 ACCESS_CHANGE 的
// 每个方法都必须显式声明 AUDIT_NONE 或 AUDIT_WRITE，ACCESS_CHANGE 只能是 AUDIT_WRITE；ACCESS_READ 与 ACCESS_LOGIN 的
// 方法不得声明（保持 AUDIT_UNSPECIFIED）：READ 按定义无副作用，LOGIN 是认证本身——签发的会话连同来源记在会话表里
// （ListSessions），失败与锁定走登录通知，不进操作记录。任一条不满足时 hub 在构造处理器时拒绝启动，新增方法不会以
// "默认不记"随发布出去。
enum Audit {
  AUDIT_UNSPECIFIED = 0;
  // 没有任何成功路径改变 hub 的持久状态或向外发出动作：只读（含读出凭据元数据、回显可能含密钥的内容、向外部
  // 只读查询），或只在本会话的进程内留下短期授权（主题交互预览）。
  AUDIT_NONE = 1;
  // 有成功路径改变 hub 的持久状态或向外发出动作（发送测试通知、提交 hub 自身更新）。会话调用的每次成功恰好写一条
  // 操作记录，持久状态的改动与记录在同一事务提交，业务拒绝不写；向外的动作先发出再写记录，记录写失败时回答
  // Internal。ExecuteChange 由类型化变更的回执承担：执行写一条，预览与重放不写。
  AUDIT_WRITE = 2;
}

extend google.protobuf.MethodOptions {
  // 50000–99999 是留给组织内部扩展的字段号区间。
  Access access = 50001;
  Audit audit = 50003;
}
