syntax = "proto3";

package heron.v1;

option go_package = "github.com/xjetry/heron/gen/heron/v1;heronv1";

import "heron/v1/types.proto";

// 历史查询的请求与响应。AdminService 与 PublicService 的 QueryMetrics、QueryProbes、ListProbeComparisonNodes、
// QueryProbeComparison 共用这些类型。
//
// 读量额度：窗口按 max_points 定下的步长对齐后，各级数据的实际来源行数在聚合前计数；一次请求要读的行超过额度时
// 返回 FailedPrecondition，消息给出额度与各级数据整理到的时刻。额度只看窗口内实际有多少行，与窗口在不在未来、
// 库是否为空无关；常见的触发原因是数据整理长期停滞；探测历史还可能因节点上的任务更替频繁、窗口又很长而超额。缩短窗口或增大
// max_points 后再查。
// 它们不放在 admin.proto：protoc-gen-es 把被 import 的文件一律生成为运行时依赖（admin_pb.ts 为 access 选项
// import 的 access_pb 即是一例），public.proto 若为这些类型 import admin.proto，公开页的包就会带上 AdminService
// 的描述符。所以 public.proto 不得 import admin.proto，本文件也不得 import 它。

message QueryMetricsRequest {
  int64 node_id = 1;
  // 窗口 [from, to)，Unix 秒。跨度最长 400 天。
  int64 from = 2;
  int64 to = 3;
  // 返回点数上限；0 取默认 720，最大 2000。hub 据此选择步长。
  uint32 max_points = 4;
}

message QueryMetricsResponse {
  // 窗口选定的基础聚合级别：1m、5m 或 1h；较新的区间可由更细数据按同一 step_s 聚合补齐。
  string level = 1;
  // 每个点覆盖的秒数；是所选级别桶长的整数倍。
  uint32 step_s = 2;
  // 各点起始，Unix 秒，已对齐到 step_s 的整数倍。只包含有行的点：
  // 缺失的 ts 表示该段完全没有数据。末桶可以是由已刷出分钟构成的未完成桶，
  // 不含 live 内存里尚未刷出的当前分钟。
  repeated int64 ts = 3;
  // 每个指标一条，与 metric 描述表同名同序。
  repeated MetricSeries series = 4;
  // 与 ts 一一对应；三个计数独立可缺席，缺席表示无法从留存历史证明。
  // 纯观测点的指标 n 均为 0，不代表测得的零值。
  repeated PointCoverage coverage = 5;
  // 请求窗口的覆盖汇总，与 max_points 和输出步长无关；两个服务均返回。
  optional CoverageSummary coverage_summary = 6;
}

message PointCoverage {
  // 留存在历史数据中的已准入上报分钟数，与任一指标的样本数无关。
  optional uint32 minutes = 1;
  // 被 hub 观测的分钟数：接收边界覆盖整分钟，2.5 秒采样，相邻单调间隔不超过
  // 5 秒，墙钟与单调钟增量之差不超过 2 秒；不证明逐请求可服务，不是在线率。
  optional uint32 observed = 2;
  // 既被观测、又有已准入上报的分钟数；已知时不大于 minutes 与 observed。
  optional uint32 observed_reported = 3;
}

message CoverageSummary {
  // 完整落在请求窗口内、覆盖起点之后且在查询时已闭合的分钟数；与有没有数据无关。
  uint64 eligible_minutes = 1;
  // 只累加完整落在 eligible 集合内、该列已知的源桶；部分源桶与未知列不计。
  // 未知分钟数 = eligible_minutes - observed_minutes，不计入覆盖率分母。
  uint64 observed_minutes = 2;
  // 覆盖率 = observed_reported_minutes / observed_minutes；分母为 0 时无可观测区间。
  uint64 observed_reported_minutes = 3;
  // 覆盖起点，Unix 秒，分钟对齐：接收首次上报的分钟，迁移前节点为最早留存证据。
  // 缺席表示尚无留存的覆盖记录，此时 eligible_minutes 为 0，不断言节点从未上报。
  optional int64 coverage_start = 4;
}

message MetricSeries {
  // cpu、mem_used、swap_used、disk_used、load1、tcp、udp、procs、rx_bytes、tx_bytes、
  // memory_used_pct、disk_used_pct、net_rx_bps、net_tx_bps、disk_read_bps、disk_write_bps、
  // cpu_steal_pct、cpu_iowait_pct、load1_per_core、tcp_active_opens_ps、tcp_passive_opens_ps、
  // tcp_out_segs_ps、tcp_retrans_segs_ps。顺序同 hub 的指标描述表（internal/hub/metric.Columns），
  // 新指标只追加在末尾；客户端按 name 取。
  // 重传率不是一条序列：同一个点上 tcp_retrans_segs_ps 与 tcp_out_segs_ps 的 mean × n 相除再乘 100；分母为 0 时没有重传率。
  string name = 1;
  // percent、bytes、bytes/s、count、count/s；load 无单位为空串。
  string unit = 2;
  // 与 ts 一一对应。
  repeated MetricSample samples = 3;
}

message MetricSample {
  // 该点内的样本数；0 表示该指标在这段时间没有任何读数，此时 mean、max 与 sum 都缺失。
  uint32 n = 1;
  // 采样算术均值。net_rx_bps/net_tx_bps 的采样均值不代替字节增量除以桶长所得的平均速率。
  optional double mean = 2;
  // 只有带最大值的指标（cpu、mem_used、net_rx_bps、net_tx_bps、disk_read_bps、disk_write_bps、
  // cpu_steal_pct、cpu_iowait_pct、tcp_active_opens_ps、tcp_passive_opens_ps）才有。
  // 网络峰值为 agent 各采样间隔速率的最大值，不是未被采样捕获的瞬时最高值；旧历史缺失。
  optional double max = 3;
  // 只有可加量指标（rx_bytes、tx_bytes）才有：该点内的字节总和，没有 mean 与 max。
  // 速率 = sum / step_s。
  optional double sum = 4;
}

message QueryProbesRequest {
  int64 node_id = 1;
  // 窗口 [from, to)，Unix 秒。跨度最长 400 天。
  int64 from = 2;
  int64 to = 3;
  // 返回点数上限；0 取默认 720，最大 2000。hub 据此选择步长。
  uint32 max_points = 4;
}

message QueryProbesResponse {
  // 窗口选定的基础聚合级别：1m、5m 或 1h；较新的区间可由更细数据按同一 step_s 聚合补齐。
  string level = 1;
  // 每个点覆盖的秒数；是所选级别桶长的整数倍。
  uint32 step_s = 2;
  // 每个任务一条，按当前展示顺序；只含窗口内有结果的任务。已删除的任务不出现：删除一提交，它的历史就不再返回，
  // 库里的残留行由维护循环随后删掉。AdminService 上调用方看不到的任务（受限 token 的范围之外）排在可见任务之后、
  // 按 task_id 升序。
  repeated ProbeSeries series = 3;
}

message ProbeSeries {
  uint64 task_id = 1;
  // 按 ts 升序；只包含 sent > 0 的点，缺失的 ts 表示该段没有结果。
  repeated ProbeSample samples = 2;
  // 任务的种类与目标，查询时从任务清单读取；不标注时 kind 为 PROBE_KIND_UNSPECIFIED、target 为空串，
  // 客户端退回用 task_id 称呼。AdminService.QueryProbes 按调用方可见的任务当前的配置标注：改过目标的任务整段历史按新目标
  // 标注，调用方看不到的任务不标注（已删除的任务不出现在序列里）。PublicService.QueryProbes 只标注当前分配给被查节点的
  // 任务：节点公开即公开它正在探测的目标，已从该节点撤下的任务，当前目标不一定被该节点探测过，不标注。
  ProbeKind kind = 3;
  string target = 4;
}

message ProbeSample {
  // 点起始，Unix 秒，已对齐到 step_s 的整数倍。末桶可以是由已刷出分钟构成的未完成桶，
  // 不含 live 内存里尚未刷出的当前分钟。
  int64 ts = 1;
  uint32 sent = 2;
  // 计入丢包的超时数；丢包率 = lost / sent，errors 不计入。
  uint32 lost = 3;
  uint32 errors = 4;
  // 只有 sent − lost − errors > 0 时才有：该点内成功探测的 rtt 均值 / 最小 / 最大，微秒。
  optional uint32 rtt_mean_us = 5;
  // 成功探测的最小 rtt，微秒；只有 sent − lost − errors > 0 时才有。
  optional uint32 rtt_min_us = 6;
  // 成功探测的最大 rtt，微秒；只有 sent − lost − errors > 0 时才有。
  optional uint32 rtt_max_us = 7;
}

message ListProbeComparisonNodesRequest {
  uint64 task_id = 1;
}

// 一次跨节点对比的成员与标注，在同一个读快照里读出。之后取样本时不再核对分配：List 之后撤下分配的节点留在本次
// 对比里，之后新分配的节点要等下一次 List；改任务目标、间隔、超时或 DNS 服务器也只在下一次 List 体现。
// 样本本来就按 task_id 跨配置累积，与 QueryProbes 的历史一样。
message ListProbeComparisonNodesResponse {
  // 任务的种类与目标，标注规则同 QueryProbes 的 ProbeSeries.kind、target：调用方不可标注时 kind 为
  // PROBE_KIND_UNSPECIFIED、target 为空串。PublicService 在任务分配给了至少一个公开节点时标注。
  ProbeKind kind = 1;
  string target = 2;
  // 当前分配了该任务、且调用方可见的节点，按节点全序（sort_order, id）升序；顺序只决定显示。
  // 一个都没有时整个请求返回 NotFound，与任务不存在不加区分。
  repeated int64 node_ids = 3;
  // QueryProbeComparisonRequest.node_ids 一次最多可带的节点数，与 hub 校验用的是同一个值，恒为正。
  // 客户端按它分块；收到 0 是协议错误，不能当作不限。
  uint32 max_nodes_per_query = 4;
}

message QueryProbeComparisonRequest {
  uint64 task_id = 1;
  // 1 到 max_nodes_per_query 个，不得重复。hub 不核对这些节点是否仍分配了该任务：每个节点按与 QueryProbes
  // 相同的节点可见性单独授权，返回的是该节点历史里这个任务的部分，不比 QueryProbes 多给任何东西。
  repeated int64 node_ids = 2;
  // 窗口 [from, to)、max_points 与 QueryProbesRequest 相同，选级与步长也相同。
  int64 from = 3;
  int64 to = 4;
  uint32 max_points = 5;
}

message QueryProbeComparisonResponse {
  // 同 QueryProbesResponse；本响应里所有节点共用。
  string level = 1;
  uint32 step_s = 2;
  // 可见节点各一条，与请求的 node_ids 同序；窗口内没有结果的节点也在，samples 为空。
  repeated NodeProbeSamples series = 3;
  // 不可见或不存在的节点，二者不加区分，与 QueryProbes 对二者同样返回 NotFound 一致；顺序同请求。
  repeated int64 unavailable_node_ids = 4;
}

message NodeProbeSamples {
  int64 node_id = 1;
  // 与 ProbeSeries.samples 同一形状与稀疏规则。
  repeated ProbeSample samples = 2;
}
